<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Demo Flask App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='main_styles.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light px-3">
        <a class="navbar-brand" href="{{ url_for('home') }}">Flower Shop</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('welcome', name='World') }}">Welcome</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li> <!-- Added login link -->
        </ul>
    </nav>

    <header class="text-center p-5 bg-dark text-white">
        <h1>Welcome To Our Flower Shop</h1>
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Flask_logo.svg" width="100" alt="Flask logo">
        <p>This is a demo application written in Python with the Flask micro web framework.</p>
        <p>It uses Jinja templates and Bootstrap 5.</p>
        <p> Have a look at our beautiful flowers.</p>
    </header>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center p-3 bg-secondary text-white">
        &copy; 2024 Group 2
    </footer>
</body>
</html>
